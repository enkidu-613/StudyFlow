services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STUDYFLOW_POSTGRES_DB}
      POSTGRES_USER: ${STUDYFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${STUDYFLOW_POSTGRES_PASSWORD}
    volumes:
      - studyflow_postgres:/var/lib/postgresql/data
    networks:
      - studyflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    # Only the host-local cloudflared connector may reach the API directly.
    # Public traffic enters through the Cloudflare Tunnel, never this port.
    ports:
      - "127.0.0.1:8000:8000"
    expose:
      - "8000"
    networks:
      - studyflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STUDYFLOW_DATABASE_URL: ${STUDYFLOW_DATABASE_URL}
      STUDYFLOW_TOKEN_SIGNING_KEY: ${STUDYFLOW_TOKEN_SIGNING_KEY}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  studyflow:
    driver: bridge

volumes:
  studyflow_postgres:
