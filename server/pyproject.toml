[tool.poetry]
name = "studyflow-server"
version = "0.1.0"
description = "StudyFlow API"
authors = []
packages = [{ include = "server", from = ".." }]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
pydantic = "^2.9.0"
sqlalchemy = "^2.0.0"
asyncpg = "^0.29.0"
greenlet = "^3.0.0"
alembic = "^1.13.0"
argon2-cffi = "^25.1.0"
pyjwt = "^2.10.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.27.0"
aiosqlite = "^0.21.0"

[tool.pytest.ini_options]
markers = [
    "integration: requires STUDYFLOW_TEST_DATABASE_URL and applies real PostgreSQL migrations",
]

[tool.alembic]
script_location = "migrations"
prepend_sys_path = ".."

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
