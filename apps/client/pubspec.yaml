name: studyflow
description: StudyFlow cross-platform client.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  drift: ^2.34.3
  sqlite3: ^3.5.0
  cryptography: 2.9.0
  flutter_secure_storage: ^10.3.1
  path: ^1.9.1
  path_provider: ^2.1.5
  http: ^1.3.0
  flutter_markdown: ^0.7.7+1
  studyflow_domain:
    path: ../../packages/domain
  studyflow_sync_contract:
    path: ../../packages/sync_contract
  studyflow_platform_contract:
    path: ../../packages/platform_contract

dev_dependencies:
  flutter_test:
    sdk: flutter
  analyzer: 13.0.0
  build_runner: ^2.7.1
  drift_dev: ^2.34.3
  flutter_lints: ^4.0.0

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  generate: true
