name: studyflow
description: StudyFlow cross-platform client.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  drift: ^2.20.3
  sqlite3: ^2.4.6
  studyflow_domain:
    path: ../../packages/domain
  studyflow_sync_contract:
    path: ../../packages/sync_contract
  studyflow_platform_contract:
    path: ../../packages/platform_contract

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
